name: ERD and integration tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  erd-and-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: simple
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      DJ_HOST: 127.0.0.1
      DJ_PORT: 3306
      DJ_USER: root
      DJ_PASS: simple
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest numpy
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Generate ERD
        run: |
          python tests/generate_erd.py

      - name: Upload ERD artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-schemas-erd
          path: base_schemas_erd.png

      - name: Run integration tests
        run: |
          pytest -q tests/test_imports.py tests/test_populate_base_db.py
