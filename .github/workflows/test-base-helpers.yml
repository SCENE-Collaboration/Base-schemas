name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-base-helpers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest numpy

      - name: Run helper unit tests
        run: |
          pytest -q tests/test_populate_base_helpers.py
