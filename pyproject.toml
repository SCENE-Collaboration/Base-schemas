[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "base-schemas"
version = "3.0.0"
description = "MLAI base DataJoint schemas extending the shared SCENE layer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datajoint>=2.2",
    "numpy",  # ingestion reads the GUI's .npy metadata files
    "packaging", # required by datajoint > 1
    "scene-pipelines @ git+https://github.com/SCENE-Collaboration/SCENE-pipelines.git@dev",
]

[tool.setuptools.packages.find]
include = ["base_schemas*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:fetch\\(\\) is deprecated in DataJoint 2\\.0.*:DeprecationWarning",
    "ignore:Positional inserts \\(tuples/lists\\) are deprecated and will be removed in a future version\\..*:DeprecationWarning",
    "ignore:Table class name `.*` contains underscores\\. CamelCase names without underscores are recommended\\.:UserWarning",
]
