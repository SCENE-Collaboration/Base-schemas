[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "base-schemas"
version = "2.0.0"
description = "SCENE shared DataJoint base schemas (legacy mice/exp + emerging SCENE spine)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    # datajoint 2.2 dropped Python 3.8; pin to <2.2 there and require >=2.2 elsewhere.
    # sync.py requires datajoint>=2.2 (dj.Instance); enforced at runtime on 3.8.
    "datajoint>=0.13,<2.2; python_version < '3.9'",
    "datajoint>=2.2; python_version >= '3.9'",
    "packaging", # required by datajoint > 1
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.5",
    "pytest>=7",
    "ruff>=0.15",
]

[tool.setuptools.packages.find]
include = ["base_schemas*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:fetch\\(\\) is deprecated in DataJoint 2\\.0.*:DeprecationWarning",
    "ignore:Positional inserts \\(tuples/lists\\) are deprecated and will be removed in a future version\\..*:DeprecationWarning",
    "ignore:Table class name `.*` contains underscores\\. CamelCase names without underscores are recommended\\.:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py38"
src = ["base_schemas", "tests"]
extend-exclude = [
    # Frozen Mathis-lab example schemas — keep DJ definitions as-is.
    "examples/mouselab_schemas",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"base_schemas/scripts/*.py" = ["E501"]
"tests/*.py" = ["E501"]
