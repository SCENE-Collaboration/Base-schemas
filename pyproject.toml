[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "base-schemas"
version = "2.0.0"
description = "Mathis lab base DataJoint schemas"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "datajoint>=0.13", # for dj.Schema() lazy style
    "packaging", # required by datajoint > 1
]

[tool.setuptools.packages.find]
include = ["base_schemas*"]
